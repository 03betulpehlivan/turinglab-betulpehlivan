name: "binary_compare"

states:
  - q0
  - q_check
  - q_accept
  - q_reject

input_alphabet:
  - "0"
  - "1"
  - "#"

tape_alphabet:
  - "0"
  - "1"
  - "#"
  - "_"

blank_symbol: "_"

start_state: q0

accept_states:
  - q_accept

reject_states:
  - q_reject

transitions:

  - state: q0
    read: "0"
    next: q0
    write: "0"
    move: R

  - state: q0
    read: "1"
    next: q0
    write: "1"
    move: R

  - state: q0
    read: "#"
    next: q_check
    write: "#"
    move: R

  - state: q_check
    read: "0"
    next: q_accept
    write: "0"
    move: R

  - state: q_check
    read: "1"
    next: q_accept
    write: "1"
    move: R

  - state: q_check
    read: "_"
    next: q_reject
    write: "_"
    move: R