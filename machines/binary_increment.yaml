name: "binary_increment"

states:
  - q0
  - q_accept

input_alphabet:
  - "1"

tape_alphabet:
  - "1"
  - "_"

blank_symbol: "_"

start_state: q0

accept_states:
  - q_accept

transitions:

  - state: q0
    read: "1"
    next: q0
    write: "1"
    move: R

  - state: q0
    read: "_"
    next: q_accept
    write: "1"
    move: R